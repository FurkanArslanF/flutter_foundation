name: flutter_app_foundation
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Responsive UI
  flutter_screenutil: ^5.9.3
  kartal: ^5.0.0

  # Router
  go_router: ^17.5.0

  # Localization
  easy_localization: ^3.0.8

  # State Management
  riverpod: ^3.4.2
  hooks_riverpod: ^3.4.2

  # HTTP Client
  dio: ^5.11.0

  # Environment Variables
  envied: ^1.3.8

  # JSON Serialization
  json_annotation: ^4.12.0

  # App Versioning
  upgrader: ^13.6.0

  # Storage
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.5.5
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5

  # Connectivity
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1

  # UI
  # lottie: ^3.5.1
  flagkit: ^0.0.3

  # Fonts
  google_fonts: ^8.2.1

  # Toast
  fluttertoast: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.14.1
  build_runner: ^2.15.1
  envied_generator: ^1.3.8
  flutter_launcher_icons: ^0.14.4
  very_good_analysis: ^10.3.0
  swagger_dart_code_generator: ^4.1.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/appLogo.png"
  remove_alpha_ios: true
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/lang/
