# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
#include: package:flutter_lints/flutter.yaml
analyzer:
  errors:
    discarded_futures: ignore
    no_literal_bool_comparisons: ignore
    strict_raw_type: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:very_good_analysis/analysis_options.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # === DISABLED FOR PRACTICAL REASONS ===
    # Documentation is time-consuming for internal code
    public_member_api_docs: false
    # Modern screens can handle longer lines
    lines_longer_than_80_chars: false
    # Keep existing quote style (team preference)
    prefer_single_quotes: false
    # Parameter ordering flexibility
    always_put_required_named_parameters_first: false
    # Constructor ordering flexibility
    sort_constructors_first: false
    # Manual dependency organization preferred
    sort_pub_dependencies: false
    # Ignore comment documentation not critical
    document_ignores: false
    # Too strict for practical development
    avoid_dynamic_calls: false
    avoid_catches_without_on_clauses: false
    avoid_positional_boolean_parameters: false
    avoid_bool_literals_in_conditional_expressions: false
    use_named_constants: false
    flutter_style_todos: false

    # === ENABLED FOR BETTER CODE QUALITY ===
    # Organize imports properly (dart:, package:, relative)
    directives_ordering: true
    # Use ?? operator for null-to-bool conversion
    #use_if_null_to_convert_nulls_to_bools: true
    # Declare types for public APIs for better documentation
    type_annotate_public_apis: true
    # Remove statements that have no effect
    unnecessary_statements: true
    # Use int literals instead of double when appropriate
    prefer_int_literals: true
    # Files should end with a newline
    eol_at_end_of_file: true
    # Performance boost - const widgets
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    # Immutability - safer code
    prefer_final_locals: true
    # Remove unnecessary null checks
    unnecessary_null_checks: true
    # Modern Dart style
    prefer_if_elements_to_conditional_expressions: true
    # Avoid redundant null-aware operators
    unnecessary_null_aware_assignments: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
